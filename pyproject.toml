[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-markov-voice-conversion"
version = "0.0.0"
description = "HMVC Phase 0: self-contained HMS synthesis-engine foundation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.20",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hmvc*"]
namespaces = false

[tool.setuptools.package-data]
"hmvc.engine" = ["LICENSE.hms", "UPSTREAM.json", "config/phonemes.yaml"]
"hmvc.engine.vocoder" = ["_native/*.sh", "_native/*.cpp", "_native/*.so", "_native/*.dylib", "_native/*.dll"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
