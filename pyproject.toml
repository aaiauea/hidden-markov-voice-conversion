[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-markov-voice-conversion"
version = "0.0.0"
description = "HMVC: self-contained HMS synthesis engine and classical acoustic feature extraction"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.20",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Maintainer-only: reference libraries for tools/generate_feature_reference.py
# and tools/evaluate_features.py (install in a separate environment).  Never
# imported by hmvc or by the test suite.
reference = ["pyworld>=0.3.5", "pysptk>=1.0.1", "librosa>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hmvc*"]
namespaces = false

[tool.setuptools.package-data]
"hmvc.engine" = ["LICENSE.hms", "UPSTREAM.json", "config/phonemes.yaml"]
"hmvc.engine.vocoder" = ["_native/*.sh", "_native/*.cpp", "_native/*.so", "_native/*.dylib", "_native/*.dll"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
